# GHC 9.12.2, same snapshot as the slumber engine (../slumber/stack.yaml)
resolver: nightly-2025-08-12

packages:
  - apecs
  - apecs-physics
  - apecs-gloss
  - apecs-stm
  - examples

allow-newer: true

nix:
  pure: false
  packages:
    - libGL
    - freeglut
    - mesa_glu
    - zlib

system-ghc: true
install-ghc: false
